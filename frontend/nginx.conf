server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API: el navegador llama a /api/... (mismo origen) y nginx lo reenvia al
    # contenedor "backend". Asi el frontend compilado no necesita saber la IP
    # del servidor donde se despliega (util en Windows / laboratorio).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA de Angular: cualquier ruta devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
